<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Kimberly Yu</title>
  <meta name="robots" content="noindex" />
  <script>(function(){ try { var t = sessionStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch(e){} })();</script>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@400;500;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" />
  <style>
    :root { --bg: #0c0f12; --text: #f4f0e7; --dim: #a6adb4; --gold: #d4af62; --gold-bright: #f2d999; --cinnabar: #c8503a; --line: rgba(212,175,98,0.28); }
    :root[data-theme="light"] { --bg: #efe6d4; --text: #2b2418; --dim: #6b6152; --gold: #8f6a24; --gold-bright: #6f5118; --line: rgba(143,106,36,0.35); }
    @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --bg: #efe6d4; --text: #2b2418; --dim: #6b6152; --gold: #8f6a24; --gold-bright: #6f5118; --line: rgba(143,106,36,0.35); } }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(900px 600px at 50% 30%, rgba(212,175,98,0.08), transparent 70%), var(--bg); color: var(--text); font-family: Jost, system-ui, sans-serif; text-align: center; }
    .zh { display: block; font-family: "Ma Shan Zheng", cursive; font-size: 4.5rem; line-height: 1; color: var(--cinnabar); }
    .code { margin: 18px 0 6px; font-size: 0.78rem; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--gold); }
    h1 { margin: 0; font-family: "Cormorant Garamond", Georgia, serif; font-weight: 700; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; }
    p { max-width: 38ch; margin: 14px auto 0; color: var(--dim); line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 30px; }
    a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 22px; border-radius: 999px; font-weight: 600; text-decoration: none; }
    .primary { background: var(--gold); color: #1a1408; }
    .primary:hover { background: var(--gold-bright); }
    .ghost { color: var(--gold); box-shadow: inset 0 0 0 1px var(--line); }
    .ghost:hover { box-shadow: inset 0 0 0 1px var(--gold); }
    a:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="zh" aria-hidden="true">迷</span>
    <p class="code">404 · Page not found</p>
    <h1>This page wandered off.</h1>
    <p>The link may be old or mistyped. Everything I’ve built is still one click away.</p>
    <div class="actions">
      <a class="primary" href="/#projects">See my work</a>
      <a class="ghost" href="/">Go home</a>
    </div>
  </main>
</body>
</html>
